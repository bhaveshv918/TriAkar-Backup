<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriAkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #EDEAE4;
      min-height: 100vh;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15em;
      line-height: 1;
    }

    .latin-line {
      display: flex;
      align-items: baseline;
    }

    .tri {
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(56px, 10vw, 112px);
      color: #C07830;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    .akar {
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(56px, 10vw, 112px);
      color: #1a1a1a;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 1.2s;
    }

    .hindi-line {
      display: flex;
      align-items: baseline;
      margin-top: 0.05em;
    }

    .hindi-tri {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 6.5vw, 72px);
      color: #C07830;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 2.2s;
    }

    .hindi-akar {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 6.5vw, 72px);
      color: #1a1a1a;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 2.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="latin-line">
      <span class="tri">TRI</span><span class="akar">AKAR</span>
    </div>
    <div class="hindi-line">
      <span class="hindi-tri">त्रि</span><span class="hindi-akar">आकार</span>
    </div>
  </div>
</body>
</html>
