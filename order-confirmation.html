<style>
.confirm-wrap{min-height:calc(100vh - var(--total-h));display:flex;align-items:flex-start;justify-content:center;padding:72px var(--pad) 80px;background:var(--ivory)}
.confirm-inner{max-width:580px;width:100%}

/* top check mark */
.confirm-check{width:56px;height:56px;border-radius:50%;background:var(--charcoal);display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.confirm-check svg{width:26px;height:26px}

.confirm-title{font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.02em;color:var(--charcoal);margin-bottom:6px}
.confirm-sub{font-size:14px;color:var(--warm);line-height:1.7;margin-bottom:36px}

/* order meta */
.confirm-meta{display:flex;gap:32px;margin-bottom:36px;flex-wrap:wrap}
.confirm-meta-item{display:flex;flex-direction:column;gap:4px}
.confirm-meta-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--stone)}
.confirm-meta-value{font-size:14px;font-weight:600;color:var(--charcoal)}

/* divider */
.confirm-divider{height:1px;background:var(--stone-p);margin:0 0 28px}

/* items */
.confirm-items-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--stone);margin-bottom:16px}
.confirm-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--stone-p)}
.confirm-item:last-child{border-bottom:none}
.confirm-item-name{font-size:14px;font-weight:500;color:var(--charcoal)}
.confirm-item-qty{font-size:12px;color:var(--stone);margin-top:2px}
.confirm-item-price{font-size:14px;font-weight:600;color:var(--charcoal);white-space:nowrap}

/* total row */
.confirm-total-row{display:flex;justify-content:space-between;align-items:center;padding:20px 0 0;margin-top:4px}
.confirm-total-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--stone)}
.confirm-total-value{font-size:20px;font-weight:700;color:var(--charcoal)}

/* status badge */
.status-badge{display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:2px;background:#DCFCE7;color:#14532D}

/* actions */
.confirm-actions{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}

/* loading / error */
.confirm-loading{padding:60px 0;text-align:center;font-size:13px;color:var(--stone);letter-spacing:.06em}
.confirm-error{padding:60px 0;text-align:center}
.confirm-error p{font-size:14px;color:var(--stone);margin-bottom:20px}

@media(max-width:600px){
  .confirm-wrap{padding:48px var(--pad) 60px;align-items:flex-start}
  .confirm-meta{gap:20px}
}

<script src="/partials.js"></script>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

  <div class="cart-head"><h3>Cart</h3><button class="cart-close" onclick="closeCart()" aria-label="Close cart">×</button></div>

<script defer src="shared.js"></script>
<script>
const API_BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:3000' : 'https://triakar.onrender.com';

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
}

function renderOrder(order) {
  const items = order.items || order.order_items || [];
  const orderId = order.order_id || order.invoice_number || ('TRK-' + order.id.slice(0, 8).toUpperCase());

  const itemsHtml = items.map(function(item) {
    const name = item.name || (item.products ? item.products.name : 'Product');
    const qty = item.quantity || 1;
    const price = Number((item.unit_price || item.total || 0) * (item.unit_price ? qty : 1)).toLocaleString('en-IN');
    return '<div class="confirm-item">'
      + '<div><div class="confirm-item-name">' + name + '</div>'
      + '<div class="confirm-item-qty">Qty ' + qty + '</div></div>'
      + '<div class="confirm-item-price">₹' + price + '</div>'
      + '</div>';
  }).join('');

  const st = order.order_status || order.status || 'placed';

  document.getElementById('confirmContent').innerHTML =
    '<div class="confirm-check">'
    + '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    + '</div>'
    + '<div class="confirm-title">Order Confirmed</div>'
    + '<p class="confirm-sub">Thank you! We\'ll start making your items right away.<br>Use your order ID <strong>' + orderId + '</strong> to <a href="track-order.html?id=' + encodeURIComponent(orderId) + '" style="color:var(--accent)">track your order</a>.</p>'

    + '<div class="confirm-meta">'
    + '<div class="confirm-meta-item"><div class="confirm-meta-label">Order ID</div><div class="confirm-meta-value" style="display:flex;align-items:center;gap:8px;">' + orderId + '<button id="copyIdBtn" onclick="copyOrderId(\'' + orderId + '\',this)" title="Copy order ID" style="background:none;border:1px solid var(--stone-p);padding:3px 9px;cursor:pointer;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--stone);font-family:var(--font-b);flex-shrink:0;transition:all .2s">COPY</button></div></div>'
    + '<div class="confirm-meta-item"><div class="confirm-meta-label">Date</div><div class="confirm-meta-value">' + fmtDate(order.created_at) + '</div></div>'
    + '<div class="confirm-meta-item"><div class="confirm-meta-label">Status</div><div class="confirm-meta-value"><span class="status-badge">' + st + '</span></div></div>'
    + '</div>'

    + '<div class="confirm-divider"></div>'
    + '<div class="confirm-items-title">Items Ordered</div>'
    + itemsHtml
    + '<div class="confirm-total-row"><div class="confirm-total-label">Total</div><div class="confirm-total-value">₹' + Number(order.total_amount).toLocaleString('en-IN') + '</div></div>'

    + '<div class="confirm-actions">'
    + '<a href="products.html" class="btn btn-dark">Continue Shopping</a>'
    + '<a href="account.html#orders" class="btn btn-outline">View All Orders</a>'
    + '</div>';
}

function showError(msg) {
  document.getElementById('confirmContent').innerHTML =
    '<div class="confirm-error">'
    + '<p>' + msg + '</p>'
    + '<a href="products.html" class="btn btn-dark">Back to Shop</a>'
    + '</div>';
}

async function loadOrder() {
  const orderId = new URLSearchParams(window.location.search).get('order_id');
  if (!orderId) { showError('No order ID found.'); return; }

  // Try Supabase RPC first (works without auth)
  try {
    const sb = window.supabase ? window.supabase.createClient(
      'https://qarjbmogersuaerkhlcu.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhcmpibW9nZXJzdWFlcmtobGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDMzNzMsImV4cCI6MjA5NDU3OTM3M30.iS7VcO9j9UjlmBN0EhhuWBOu6Vvrg8-SQrb3oZ25AIs'
    ) : null;
    if (sb) {
      const { data, error } = await sb.rpc('track_order_public', { p_order_id: orderId });
      if (!error && data && data.found) {
        renderOrder(data);
        return;
      }
    }
  } catch (e) {}

  // Fallback to Express API
  const token = localStorage.getItem('ta_token');
  if (!token) { showError('Order placed! Your order ID is <strong>' + orderId + '</strong>. Use it to track your order.'); return; }

  try {
    const res = await fetch(API_BASE + '/api/orders/' + orderId, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Order not found');
    const { order } = await res.json();
    renderOrder(order);
  } catch (err) {
    showError('Could not load order details. Your order ID: <strong>' + orderId + '</strong>');
  }
}

function copyOrderId(id, btn) {
  navigator.clipboard.writeText(id).then(function() {
    btn.textContent = 'COPIED ✓';
    btn.style.borderColor = '#15803D';
    btn.style.color = '#15803D';
    setTimeout(function() {
      btn.textContent = 'COPY';
      btn.style.borderColor = 'var(--stone-p)';
      btn.style.color = 'var(--stone)';
    }, 2000);
  }).catch(function() {
    /* fallback for older browsers */
    var t = document.createElement('textarea');
    t.value = id; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    btn.textContent = 'COPIED ✓';
    btn.style.color = '#15803D';
    setTimeout(function() { btn.textContent = 'COPY'; btn.style.color = 'var(--stone)'; }, 2000);
  });
}

document.addEventListener('DOMContentLoaded', function() { loadOrder(); });
</script>
