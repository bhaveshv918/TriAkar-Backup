<script>
const API_BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:3000' : 'https://triakar.onrender.com';

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
}

function renderOrder(order) {
  const items = order.items || order.order_items || [];
  const orderId = order.order_id || order.invoice_number || ('TRK-' + order.id.slice(0, 8).toUpperCase());
  const isWA = order.payment_method === 'whatsapp'
    || order.order_status === 'whatsapp_pending'
    || new URLSearchParams(window.location.search).get('via') === 'whatsapp';

  const itemsHtml = items.map(function(item) {
    const name = item.name || (item.products ? item.products.name : 'Product');
    const qty = item.quantity || 1;
    const price = Number((item.unit_price || item.price || 0) * qty).toLocaleString('en-IN');
    return '<div class="confirm-item">'
      + '<div><div class="confirm-item-name">' + name + '</div>'
      + '<div class="confirm-item-qty">Qty ' + qty + '</div></div>'
      + '<div class="confirm-item-price">₹' + price + '</div>'
      + '</div>';
  }).join('');

  const st = order.order_status || order.status || 'placed';

  const checkIcon = isWA
    ? '<div class="confirm-check" style="background:#25D366">'
      + '<svg viewBox="0 0 24 24" fill="white" width="26" height="26"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 0C5.373 0 0 5.373 0 12c0 2.117.554 4.105 1.523 5.83L.057 23.522a.5.5 0 00.62.607l5.802-1.522A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.626 0 11.999 0zm0 21.818a9.8 9.8 0 01-5.027-1.38l-.36-.214-3.726.977.995-3.63-.235-.374A9.818 9.818 0 012.182 12c0-5.415 4.403-9.818 9.818-9.818 5.414 0 9.818 4.403 9.818 9.818 0 5.414-4.404 9.818-9.819 9.818z"/></svg>'
      + '</div>'
    : '<div class="confirm-check">'
      + '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '</div>';

  const title = isWA ? 'Order Sent via WhatsApp' : 'Order Confirmed';
  const subtitle = isWA
    ? 'Your order has been sent to our WhatsApp. We\'ll confirm details and share payment info shortly.<br>Save your order ID <strong>' + orderId + '</strong> for reference.'
    : 'Thank you! We\'ll start making your items right away.<br>Use your order ID <strong>' + orderId + '</strong> to <a href="track-order.html?id=' + encodeURIComponent(orderId) + '" style="color:var(--accent)">track your order</a>.';

  const statusBadge = isWA
    ? '<span class="status-badge status-badge-wa">Partially Confirmed</span>'
    : '<span class="status-badge">' + st + '</span>';

  const waBlock = isWA
    ? '<div class="wa-note">'
      + '<div class="wa-note-icon"><svg viewBox="0 0 24 24" fill="white" width="20" height="20"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 0C5.373 0 0 5.373 0 12c0 2.117.554 4.105 1.523 5.83L.057 23.522a.5.5 0 00.62.607l5.802-1.522A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.626 0 11.999 0zm0 21.818a9.8 9.8 0 01-5.027-1.38l-.36-.214-3.726.977.995-3.63-.235-.374A9.818 9.818 0 012.182 12c0-5.415 4.403-9.818 9.818-9.818 5.414 0 9.818 4.403 9.818 9.818 0 5.414-4.404 9.818-9.819 9.818z"/></svg></div>'
      + '<div class="wa-note-body">'
      + '<div class="wa-note-title">Payment Pending — Order Partially Confirmed</div>'
      + '<div class="wa-note-text">We\'ve received your order details. Our team will message you on WhatsApp at <strong>' + (order.customer_phone || 'your number') + '</strong> to confirm the order and share payment details. Production begins after payment is received.</div>'
      + '</div></div>'
    : '';

  document.getElementById('confirmContent').innerHTML =
    checkIcon
    + '<div class="confirm-title">' + title + '</div>'
    + '<p class="confirm-sub">' + subtitle + '</p>'

    + '<div class="confirm-meta">'
    + '<div class="confirm-meta-item"><div class="confirm-meta-label">Order ID</div><div class="confirm-meta-value" style="display:flex;align-items:center;gap:8px;">' + orderId + '<button id="copyIdBtn" onclick="copyOrderId(\'' + orderId + '\',this)" title="Copy order ID" style="background:none;border:1px solid var(--stone-p);padding:3px 9px;cursor:pointer;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--stone);font-family:var(--font-b);flex-shrink:0;transition:all .2s">COPY</button></div></div>'
    + '<div class="confirm-meta-item"><div class="confirm-meta-label">Date</div><div class="confirm-meta-value">' + fmtDate(order.created_at || new Date().toISOString()) + '</div></div>'
    + '<div class="confirm-meta-item"><div class="confirm-meta-label">Status</div><div class="confirm-meta-value">' + statusBadge + '</div></div>'
    + (isWA ? '<div class="confirm-meta-item"><div class="confirm-meta-label">Payment</div><div class="confirm-meta-value" style="color:#1a6e35;font-weight:700">Pending</div></div>' : '')
    + '</div>'

    + waBlock

    + '<div class="confirm-divider"></div>'
    + '<div class="confirm-items-title">Items Ordered</div>'
    + (itemsHtml || '<p style="color:var(--stone);font-size:13px">Item details sent via WhatsApp.</p>')
    + (order.total_amount ? '<div class="confirm-total-row"><div class="confirm-total-label">Total</div><div class="confirm-total-value">₹' + Number(order.total_amount).toLocaleString('en-IN') + '</div></div>' : '')

    + '<div class="confirm-actions">'
    + '<a href="products.html" class="btn btn-dark">Continue Shopping</a>'
    + '<a href="account.html" class="btn btn-outline">View My Orders</a>'
    + '</div>';
}

function showError(msg) {
  document.getElementById('confirmContent').innerHTML =
    '<div class="confirm-error">'
    + '<p>' + msg + '</p>'
    + '<a href="products.html" class="btn btn-dark">Back to Shop</a>'
    + '</div>';
}

function _waFallback(orderId) {
  renderOrder({
    order_id: orderId,
    payment_method: 'whatsapp',
    order_status: 'whatsapp_pending',
    total_amount: 0,
    created_at: new Date().toISOString(),
    items: []
  });
}

async function loadOrder() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order_id');
  const isWAParam = params.get('via') === 'whatsapp';
  if (!orderId) { showError('No order ID found.'); return; }

  // 1. Try Supabase — query by order_id (TRK-…) only, not by UUID id
  try {
    const sb = (typeof _ensureSB === 'function') ? await _ensureSB() : null;
    if (sb) {
      const t = localStorage.getItem('ta_token');
      const r = localStorage.getItem('ta_refresh');
      if (t) { try { await sb.auth.setSession({ access_token: t, refresh_token: r || '' }); } catch (e) {} }

      const { data, error } = await sb
        .from('orders')
        .select('*, order_items(quantity, unit_price, customization_notes, products(name, images))')
        .eq('order_id', orderId)
        .maybeSingle();

      if (!error && data) {
        // Merge JSONB items as fallback when order_items rows are absent (WA orders)
        const dbItems = (data.order_items || []).map(function(i) {
          return { name: (i.products && i.products.name) || 'Item', quantity: i.quantity, unit_price: i.unit_price };
        });
        renderOrder(Object.assign({}, data, { items: dbItems.length ? dbItems : (data.items || []) }));
        return;
      }
    }
  } catch (e) { console.error('order-confirmation supabase query failed:', e); }

  // 2. No token → can't call Express API
  const token = localStorage.getItem('ta_token');
  if (!token) {
    isWAParam
      ? _waFallback(orderId)
      : showError('Order placed! Your order ID is <strong>' + orderId + '</strong>. Use it to track your order.');
    return;
  }

  // 3. Express API fallback
  try {
    const res = await fetch(API_BASE + '/api/orders/' + orderId, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('not found');
    const { order } = await res.json();
    renderOrder(order);
  } catch (err) {
    // If WA param is set, always show the WhatsApp confirmation — never generic error
    isWAParam
      ? _waFallback(orderId)
      : showError('Could not load order details. Your order ID: <strong>' + orderId + '</strong>');
  }
}

function copyOrderId(id, btn) {
  navigator.clipboard.writeText(id).then(function() {
    btn.textContent = 'COPIED ✓';
    btn.style.borderColor = '#15803D';
    btn.style.color = '#15803D';
    setTimeout(function() {
      btn.textContent = 'COPY';
      btn.style.borderColor = 'var(--stone-p)';
      btn.style.color = 'var(--stone)';
    }, 2000);
  }).catch(function() {
    /* fallback for older browsers */
    var t = document.createElement('textarea');
    t.value = id; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    btn.textContent = 'COPIED ✓';
    btn.style.color = '#15803D';
    setTimeout(function() { btn.textContent = 'COPY'; btn.style.color = 'var(--stone)'; }, 2000);
  });
}

document.addEventListener('DOMContentLoaded', function() { loadOrder(); });
</script>
