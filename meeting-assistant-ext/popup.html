<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 276px;
      background: #ffffff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      padding: 18px 16px 16px;
    }
    h1 { font-size: 0.65rem; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.13em; margin-bottom: 16px; }
    label { font-size: 0.74rem; color: #888; display: block; margin-bottom: 7px; }
    input {
      width: 100%;
      background: #f7f7f7;
      border: 1px solid #e4e4e4;
      border-radius: 7px;
      padding: 9px 11px;
      color: #333;
      font-size: 0.78rem;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #bbb; color: #111; }
    input::placeholder { color: #ccc; }
    button {
      width: 100%; margin-top: 10px;
      background: #f2f2f2;
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      padding: 9px;
      color: #666;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #eaeaea; color: #111; border-color: #ccc; }
    .saved {
      font-size: 0.72rem; color: #16a34a;
      text-align: center; margin-top: 9px;
      display: none;
    }
    hr { border: none; border-top: 1px solid #f0f0f0; margin: 16px 0; }
    .tip { font-size: 0.68rem; color: #bbb; line-height: 1.65; }
    .tip strong { color: #888; }
    kbd {
      background: #f4f4f4; border: 1px solid #e0e0e0; border-radius: 3px;
      padding: 1px 5px; font-size: 0.6rem; color: #888; font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Meeting Assistant</h1>

  <label>Anthropic API Key</label>
  <input type="password" id="keyInput" placeholder="gsk_..." spellcheck="false" autocomplete="off">
  <button id="saveBtn">Save Key</button>
  <div class="saved" id="savedMsg">✓ Saved — open Google Meet and click the mic widget</div>

  <hr>

  <div class="tip">
    <strong>How to use:</strong><br>
    1. Open <strong>meet.google.com</strong><br>
    2. Look for the mic widget bottom-right<br>
    3. Click it or press <kbd>Alt</kbd>+<kbd>M</kbd> to listen<br>
    4. Ask your question — answer appears instantly
  </div>

  <script src="popup.js"></script>
</body>
</html>
