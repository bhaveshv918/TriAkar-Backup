<script>
(function(){
  const MONTH_NAMES=['','January','February','March','April','May','June','July','August','September','October','November','December'];
  const TAG_ICON={'Replacement Part':'📦','Gifting':'🎁','Corporate':'🏢','Prototype':'🧪'};

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function setNoindex(){
    if(document.querySelector('meta[name="robots"]'))return;
    var m=document.createElement('meta');
    m.name='robots';m.content='noindex, nofollow';
    document.head.appendChild(m);
  }

  function showNotFound(){
    setNoindex();
    document.getElementById('postTitle').textContent='Story not found';
    document.getElementById('postLead').textContent='This story may have been removed or the link is out of date.';
    document.getElementById('postBody').innerHTML='<a href="stories.html" class="btn btn-outline" style="margin-top:12px;display:inline-block">← Browse All Stories</a>';
  }

  function updateMetaTags(url,title,desc,image){
    var fullTitle=title+' | TriAkar Stories';
    document.title=fullTitle;
    var descEl=document.querySelector('meta[name="description"]');
    if(descEl)descEl.setAttribute('content',desc);
    var canEl=document.getElementById('metaCanonical');
    if(canEl)canEl.setAttribute('href',url);
    var set=function(id,attr,val){var el=document.getElementById(id);if(el)el.setAttribute(attr,val);};
    set('metaOgTitle','content',fullTitle);
    set('metaOgDesc','content',desc);
    set('metaOgUrl','content',url);
    set('metaOgImage','content',image);
    set('metaOgImageAlt','content',title+', TriAkar customer story');
    set('metaTwTitle','content',fullTitle);
    set('metaTwDesc','content',desc);
    set('metaTwImage','content',image);
  }

  function injectStorySchema(s,url,image){
    var base='https://www.triakar.com';
    var schema={
      "@context":"https://schema.org","@type":"BlogPosting",
      "headline":s.title,
      "description":s.excerpt,
      "articleBody":s.full_text,
      "articleSection":s.tag,
      "image":[image],
      "inLanguage":"en-IN",
      "mainEntityOfPage":{"@type":"WebPage","@id":url},
      "publisher":{"@id":base+"/#organization"},
      "isPartOf":{"@id":base+"/stories.html#blog"}
    };
    if(s.customer_name){
      schema.about={"@type":"Person","name":s.customer_name};
    }
    var crumbs={
      "@context":"https://schema.org","@type":"BreadcrumbList",
      "itemListElement":[
        {"@type":"ListItem","position":1,"name":"Home","item":base+"/"},
        {"@type":"ListItem","position":2,"name":"Stories","item":base+"/stories"},
        {"@type":"ListItem","position":3,"name":s.title,"item":url}
      ]
    };
    ['taStorySchema','taCrumbSchema'].forEach(function(eid){var old=document.getElementById(eid);if(old)old.remove();});
    var s1=document.createElement('script');s1.type='application/ld+json';s1.id='taStorySchema';s1.textContent=JSON.stringify(schema);document.head.appendChild(s1);
    var s2=document.createElement('script');s2.type='application/ld+json';s2.id='taCrumbSchema';s2.textContent=JSON.stringify(crumbs);document.head.appendChild(s2);
  }

  const READ_KEY='ta_read_stories';
  function getReadSet(){
    try{ return new Set(JSON.parse(localStorage.getItem(READ_KEY))||[]); }catch(e){ return new Set(); }
  }
  function markRead(slug){
    if(!slug)return;
    const set=getReadSet();
    set.add(slug);
    try{ localStorage.setItem(READ_KEY, JSON.stringify([...set])); }catch(e){}
  }

  function renderAllReadMessage(wrap){
    wrap.innerHTML=`<div class="story-post-related story-post-all-read">
      <div class="story-all-read-icon">✨</div>
      <h2 class="story-all-read-h">You've read all our stories</h2>
      <p class="story-all-read-p">Every story we've shared so far, all read. We're glad you stuck around, thank you. A new one lands every month, come back and see what's next.</p>
      <a href="stories.html" class="btn btn-outline" style="margin-top:6px;display:inline-block">← Browse All Stories</a>
    </div>`;
  }

  function renderRelated(related, allRead){
    const wrap=document.getElementById('postRelated');
    if(allRead){ renderAllReadMessage(wrap); return; }
    if(!related || !related.length){ wrap.innerHTML=''; return; }
    const cards=related.slice(0,15).map(r=>{
      const monthLabel=(MONTH_NAMES[r.month]||'')+(r.year?' '+r.year:'');
      const photo=r.image_url?`<img src="${esc(r.image_url)}" alt="${esc(r.title)}" loading="lazy">`:`<div class="story-photo-fallback">${TAG_ICON[r.tag]||'✨'}</div>`;
      return `<a class="story-card" href="stories/${esc(r.slug||'')}">
        <div class="story-photo">${photo}</div>
        <div class="story-head"><span class="story-month">${esc(monthLabel)}</span><span class="story-tag">${esc(r.tag)}</span></div>
        <div class="story-body"><div class="story-title">${esc(r.title)}</div><div class="story-excerpt">${esc(r.excerpt)}</div></div>
      </a>`;
    }).join('');
    wrap.innerHTML=`<div class="story-post-related">
      <h2>More Stories Like This</h2>
      <div class="story-related-row">
        <button class="story-related-nav" id="relatedPrev" aria-label="Previous stories" onclick="storyRelatedScroll(-1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="story-related-scroll" id="relatedScroll">${cards}</div>
        <button class="story-related-nav" id="relatedNext" aria-label="Next stories" onclick="storyRelatedScroll(1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>`;
    _updateRelatedNav();
    const scroller=document.getElementById('relatedScroll');
    if(scroller)scroller.addEventListener('scroll',_updateRelatedNav,{passive:true});
  }

  function storyRelatedScroll(dir){
    const el=document.getElementById('relatedScroll');
    if(!el)return;
    el.scrollBy({left:dir*el.clientWidth,behavior:'smooth'});
  }
  window.storyRelatedScroll=storyRelatedScroll;

  function _updateRelatedNav(){
    const el=document.getElementById('relatedScroll');
    const prev=document.getElementById('relatedPrev'), next=document.getElementById('relatedNext');
    if(!el||!prev||!next)return;
    const max=el.scrollWidth-el.clientWidth;
    prev.disabled=el.scrollLeft<=4;
    next.disabled=el.scrollLeft>=max-4;
  }

  function buildUnreadRelated(currentSlug, currentTag, allStories, fallbackRelated){
    markRead(currentSlug);
    if(!allStories || !allStories.length) return {list:fallbackRelated||[], allRead:false};
    const readSet=getReadSet();
    const others=allStories.filter(x=>x.slug!==currentSlug);
    const unread=others.filter(x=>!readSet.has(x.slug));
    if(!unread.length) return {list:[], allRead:true};
    const sameTag=unread.filter(x=>x.tag===currentTag);
    const otherTag=unread.filter(x=>x.tag!==currentTag);
    return {list:sameTag.concat(otherTag).slice(0,15), allRead:false};
  }

  function openLightbox(src,alt){
    const img=document.getElementById('storyLightboxImg');
    img.src=src; img.alt=alt||'';
    document.getElementById('storyLightbox').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeLightbox(){
    document.getElementById('storyLightbox').classList.remove('open');
    document.body.style.overflow='';
  }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); });

  /* Click-to-zoom on the gallery photo. Distinguishes a tap from a
     swipe by comparing scroll position at pointerdown vs click, so
     swiping between photos doesn't accidentally pop the lightbox. */
  function setupGalleryZoom(){
    const track=document.getElementById('galleryTrack');
    if(!track) return;
    let downScroll=0;
    track.addEventListener('pointerdown',()=>{ downScroll=track.scrollLeft; },{passive:true});
    track.addEventListener('click',e=>{
      if(Math.abs(track.scrollLeft-downScroll)>5) return;
      if(e.target.tagName==='IMG') openLightbox(e.target.src,e.target.alt);
    });
  }

  function setupGallerySwipe(){
    const track=document.getElementById('galleryTrack');
    const photoEl=document.getElementById('postPhoto');
    const dots=photoEl.querySelectorAll('.story-gallery-dots span');
    const goTo=i=>track.scrollTo({left:i*track.clientWidth,behavior:'smooth'});
    const prevBtn=photoEl.querySelector('.story-gallery-arrow.prev');
    const nextBtn=photoEl.querySelector('.story-gallery-arrow.next');
    if(prevBtn) prevBtn.onclick=()=>goTo(Math.max(0,Math.round(track.scrollLeft/track.clientWidth)-1));
    if(nextBtn) nextBtn.onclick=()=>goTo(Math.min(dots.length-1,Math.round(track.scrollLeft/track.clientWidth)+1));
    track.addEventListener('scroll',()=>{
      const i=Math.round(track.scrollLeft/track.clientWidth);
      dots.forEach((d,di)=>d.classList.toggle('active',di===i));
    },{passive:true});
  }

  function render(s, related, allStories){
    const base='https://www.triakar.com';
    // NOTE: /stories/:slug is a vercel.json rewrite that currently 404s in production
    // for any client without the PWA service worker already caching it (confirmed via
    // curl and on the raw triakar.vercel.app domain, 2026-08-20 audit). /story?slug=X
    // (no .html, cleanUrls strips it) is the URL that actually resolves 200 with no
    // redirect for Googlebot and fresh visitors, so that's canonical until the rewrite
    // is fixed. Switch back to base+'/stories/'+encodeURIComponent(s.slug) once verified live.
    const url=base+'/story?slug='+encodeURIComponent(s.slug);
    const monthLabel=(MONTH_NAMES[s.month]||'')+(s.year?' '+s.year:'');
    document.getElementById('postMonth').textContent=monthLabel;
    document.getElementById('postTag').textContent=s.tag;
    document.getElementById('postTitle').textContent=s.title;
    document.getElementById('postLead').textContent=s.excerpt;
    const bodyEl=document.getElementById('postBody');
    if(s.full_text && s.full_text.trim()!==(s.excerpt||'').trim()){
      bodyEl.textContent=s.full_text;
      bodyEl.style.display='';
    } else {
      bodyEl.textContent='';
      bodyEl.style.display='none';
    }

    const photoEl=document.getElementById('postPhoto');
    let image=base+'/assets/og-image.jpg';
    const gallery=[s.image_url,...((s.images)||[])].filter(Boolean);
    if(gallery.length){
      image=gallery[0];
      const slides=gallery.map(u=>`<div class="story-gallery-slide"><img src="${esc(u)}" alt="${esc(s.title)}" loading="lazy"></div>`).join('');
      const dots=gallery.length>1?`<div class="story-gallery-dots">${gallery.map((_,i)=>`<span data-i="${i}" class="${i===0?'active':''}"></span>`).join('')}</div>`:'';
      const arrows=gallery.length>1?`<button type="button" class="story-gallery-arrow prev" aria-label="Previous photo">‹</button><button type="button" class="story-gallery-arrow next" aria-label="Next photo">›</button>`:'';
      photoEl.innerHTML=`<div class="story-gallery-track" id="galleryTrack">${slides}</div>${dots}${arrows}`;
      photoEl.style.display='';
      setupGalleryZoom();
      if(gallery.length>1) setupGallerySwipe();
    } else {
      photoEl.innerHTML=`<div class="story-post-photo-fallback">${TAG_ICON[s.tag]||'✨'}</div>`;
      photoEl.style.display='';
    }

    const custEl=document.getElementById('postCustomer');
    if(s.customer_name || s.customer_location){
      const initial=(s.customer_name||s.customer_location||'?').charAt(0).toUpperCase();
      custEl.innerHTML=`<span class="story-customer-avatar">${esc(initial)}</span><span>${s.customer_name?`<div class="story-customer-name">${esc(s.customer_name)}</div>`:''}${s.customer_location?`<div class="story-customer-loc">${esc(s.customer_location)}</div>`:''}</span>`;
      custEl.style.display='flex';
    }

    updateMetaTags(url, s.title, s.excerpt, image);
    injectStorySchema(s, url, image);
    const {list, allRead}=buildUnreadRelated(s.slug, s.tag, allStories, related);
    renderRelated(list, allRead);
  }

  function init(){
    const params=new URLSearchParams(window.location.search);
    const slug=params.get('slug');
    if(!slug){ setNoindex(); showNotFound(); return; }
    Promise.all([
      fetch(TA_API+'/api/stories/public/by-slug/'+encodeURIComponent(slug))
        .then(r=>{ if(r.status===404) throw new Error('not-found'); return r.json(); }),
      fetch(TA_API+'/api/stories/public/all').then(r=>r.json()).catch(()=>null)
    ])
      .then(([data, allData])=>{
        if(!data || !data.story) throw new Error('not-found');
        render(data.story, data.related||[], (allData && allData.stories) || null);
      })
      .catch(()=>showNotFound());
  }
  init();
})();
</script>
</body>
</html>
