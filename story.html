<script>
(function(){
  const MONTH_NAMES=['','January','February','March','April','May','June','July','August','September','October','November','December'];
  const TAG_ICON={'Replacement Part':'📦','Gifting':'🎁','Corporate':'🏢','Prototype':'🧪'};

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function setNoindex(){
    if(document.querySelector('meta[name="robots"]'))return;
    var m=document.createElement('meta');
    m.name='robots';m.content='noindex, nofollow';
    document.head.appendChild(m);
  }

  function showNotFound(){
    setNoindex();
    document.getElementById('postTitle').textContent='Story not found';
    document.getElementById('crumbTitle').textContent='Not found';
    document.getElementById('postLead').textContent='This story may have been removed or the link is out of date.';
    document.getElementById('postBody').innerHTML='<a href="stories.html" class="btn btn-outline" style="margin-top:12px;display:inline-block">← Browse All Stories</a>';
  }

  function updateMetaTags(url,title,desc,image){
    var fullTitle=title+' | TriAkar Stories';
    document.title=fullTitle;
    var descEl=document.querySelector('meta[name="description"]');
    if(descEl)descEl.setAttribute('content',desc);
    var canEl=document.getElementById('metaCanonical');
    if(canEl)canEl.setAttribute('href',url);
    var set=function(id,attr,val){var el=document.getElementById(id);if(el)el.setAttribute(attr,val);};
    set('metaOgTitle','content',fullTitle);
    set('metaOgDesc','content',desc);
    set('metaOgUrl','content',url);
    set('metaOgImage','content',image);
    set('metaOgImageAlt','content',title+', TriAkar customer story');
    set('metaTwTitle','content',fullTitle);
    set('metaTwDesc','content',desc);
    set('metaTwImage','content',image);
  }

  function injectStorySchema(s,url,image){
    var base='https://www.triakar.com';
    var schema={
      "@context":"https://schema.org","@type":"BlogPosting",
      "headline":s.title,
      "description":s.excerpt,
      "articleBody":s.full_text,
      "articleSection":s.tag,
      "image":[image],
      "inLanguage":"en-IN",
      "mainEntityOfPage":{"@type":"WebPage","@id":url},
      "publisher":{"@id":base+"/#organization"},
      "isPartOf":{"@id":base+"/stories.html#blog"}
    };
    if(s.customer_name){
      schema.about={"@type":"Person","name":s.customer_name};
    }
    var crumbs={
      "@context":"https://schema.org","@type":"BreadcrumbList",
      "itemListElement":[
        {"@type":"ListItem","position":1,"name":"Home","item":base+"/"},
        {"@type":"ListItem","position":2,"name":"Stories","item":base+"/stories"},
        {"@type":"ListItem","position":3,"name":s.title,"item":url}
      ]
    };
    ['taStorySchema','taCrumbSchema'].forEach(function(eid){var old=document.getElementById(eid);if(old)old.remove();});
    var s1=document.createElement('script');s1.type='application/ld+json';s1.id='taStorySchema';s1.textContent=JSON.stringify(schema);document.head.appendChild(s1);
    var s2=document.createElement('script');s2.type='application/ld+json';s2.id='taCrumbSchema';s2.textContent=JSON.stringify(crumbs);document.head.appendChild(s2);
  }

  function renderRelated(related){
    const wrap=document.getElementById('postRelated');
    if(!related || !related.length){ wrap.innerHTML=''; return; }
    wrap.innerHTML=`<div class="story-post-related"><h2>More Stories Like This</h2><div class="story-grid">${
      related.map(r=>{
        const monthLabel=(MONTH_NAMES[r.month]||'')+(r.year?' '+r.year:'');
        const photo=r.image_url?`<img src="${esc(r.image_url)}" alt="${esc(r.title)}" loading="lazy">`:`<div class="story-photo-fallback">${TAG_ICON[r.tag]||'✨'}</div>`;
        return `<a class="story-card" href="stories/${esc(r.slug||'')}">
          <div class="story-photo">${photo}</div>
          <div class="story-head"><span class="story-month">${esc(monthLabel)}</span><span class="story-tag">${esc(r.tag)}</span></div>
          <div class="story-body"><div class="story-title">${esc(r.title)}</div><div class="story-excerpt">${esc(r.excerpt)}</div></div>
        </a>`;
      }).join('')
    }</div></div>`;
  }

  function render(s, related){
    const base='https://www.triakar.com';
    const url=base+'/stories/'+encodeURIComponent(s.slug);
    const monthLabel=(MONTH_NAMES[s.month]||'')+(s.year?' '+s.year:'');
    document.getElementById('crumbTitle').textContent=s.title;
    document.getElementById('postMonth').textContent=monthLabel;
    document.getElementById('postTag').textContent=s.tag;
    document.getElementById('postTitle').textContent=s.title;
    document.getElementById('postLead').textContent=s.excerpt;
    document.getElementById('postBody').textContent=s.full_text;

    const photoEl=document.getElementById('postPhoto');
    let image=base+'/assets/og-image.jpg';
    if(s.image_url){
      photoEl.innerHTML=`<img src="${esc(s.image_url)}" alt="${esc(s.title)}">`;
      photoEl.style.display='';
      image=s.image_url;
    } else {
      photoEl.innerHTML=`<div class="story-post-photo-fallback">${TAG_ICON[s.tag]||'✨'}</div>`;
      photoEl.style.display='';
    }

    const custEl=document.getElementById('postCustomer');
    if(s.customer_name || s.customer_location){
      const initial=(s.customer_name||s.customer_location||'?').charAt(0).toUpperCase();
      custEl.innerHTML=`<span class="story-customer-avatar">${esc(initial)}</span><span>${s.customer_name?`<div class="story-customer-name">${esc(s.customer_name)}</div>`:''}${s.customer_location?`<div class="story-customer-loc">${esc(s.customer_location)}</div>`:''}</span>`;
      custEl.style.display='flex';
    }

    updateMetaTags(url, s.title, s.excerpt, image);
    injectStorySchema(s, url, image);
    renderRelated(related);
  }

  function init(){
    const params=new URLSearchParams(window.location.search);
    const slug=params.get('slug');
    if(!slug){ setNoindex(); showNotFound(); return; }
    fetch(TA_API+'/api/stories/public/by-slug/'+encodeURIComponent(slug))
      .then(r=>{ if(r.status===404) throw new Error('not-found'); return r.json(); })
      .then(data=>{ if(!data || !data.story) throw new Error('not-found'); render(data.story, data.related||[]); })
      .catch(()=>showNotFound());
  }
  init();
})();
</script>
