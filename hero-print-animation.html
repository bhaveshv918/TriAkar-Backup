<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TriAkar Print Animation: Preview</title>
<link rel="preconnect" href="https://js-de.sentry-cdn.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: #EAE7DF;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  /* Mirror the hero-right panel from index.html */
  .preview-shell {
    width: 440px;
    height: 520px;
    background: linear-gradient(150deg, #EDEBE4 0%, #E3DED5 60%, #DAD4C9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(0,0,0,.06);
  }
  #triakar-print-animation {
    width: 300px;
    height: 420px;
  }
</style>
<style>
/* ============================================================
   hero-print-animation.css , TriAkar hero section
   Self-contained. Safe to delete (site still works).
   Colors: #111111 · #9a9a9a · #e46a2e · neutral background
   ============================================================ */

/* ── ROOT WRAPPER ────────────────────────────────────────── */
#triakar-print-animation {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background-image:
    radial-gradient(circle, rgba(100,96,90,.18) 1px, transparent 1px);
  background-size: 20px 20px;
  background-position: center;
}

/* ── OUTER WRAP (cabinet + info stacked vertically) ─────── */
.tpa-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

/* ══════════════════════════════════════════════════════════
   PRINTER CABINET
   A clean rectangular frame that houses the print scene.
   Styled like a minimal FDM printer enclosure:
  , thin border with corner radius
  , subtle inner shadow for depth
  , same neutral palette as the site background
   ══════════════════════════════════════════════════════════ */
.tpa-cabinet {
  position: relative;
  width: 270px;
  padding: 20px 14px 14px;   /* top padding makes room for the LIVE label */
  background: rgba(220,216,208,0.45);
  border: 1.5px solid rgba(0,0,0,0.13);
  border-radius: 6px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.55),
    inset 0 -1px 0 rgba(0,0,0,0.06),
    0 2px 8px rgba(0,0,0,0.07);
}

/* Corner accent marks, evoke real printer frame brackets */
.tpa-cabinet::before,
.tpa-cabinet::after {
  content: '';
  position: absolute;
  width: 10px;
  height: 10px;
  border-color: #9a9a9a;
  border-style: solid;
  opacity: 0.5;
}
.tpa-cabinet::before {
  top: 5px;
  left: 5px;
  border-width: 1.5px 0 0 1.5px;
  border-radius: 2px 0 0 0;
}
.tpa-cabinet::after {
  top: 5px;
  right: 5px;
  border-width: 1.5px 1.5px 0 0;
  border-radius: 0 2px 0 0;
}

/* ── LIVE PRINT LABEL, top-left of cabinet ─────────────── */
.tpa-label {
  position: absolute;
  top: 7px;
  left: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Manrope', sans-serif;
  font-size: 7.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #9a9a9a;
  user-select: none;
  z-index: 30;
}

.tpa-label-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #e46a2e;
  animation: tpa-blink 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes tpa-blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

/* ── SCENE (inside cabinet) ──────────────────────────────── */
.tpa-scene {
  position: relative;
  width: 100%;            /* fills the cabinet inner width */
  height: 280px;
}

/* ══════════════════════════════════════════════════════════
   GANTRY, the moving assembly (rail + head as one unit)
   ══════════════════════════════════════════════════════════ */
.tpa-gantry {
  position: absolute;
  left: 0;
  right: 0;
  height: 37px;          /* carriage 14 + hotend 18 + nozzle 5 */
  z-index: 20;
  will-change: top;
}

/* Rail spans full gantry width */
.tpa-rail-track {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(
    90deg,
    transparent,
    #9a9a9a 5%,
    #c0bcb8 50%,
    #9a9a9a 95%,
    transparent
  );
  border-radius: 2px;
}

.tpa-rail-track::before,
.tpa-rail-track::after {
  content: '';
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 5px;
  height: 9px;
  background: #888;
  border-radius: 1px;
}
.tpa-rail-track::before { left: 0; }
.tpa-rail-track::after  { right: 0; }

/* ── PRINT HEAD ──────────────────────────────────────────── */
.tpa-head {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  will-change: left;
}

.tpa-carriage {
  width: 28px;
  height: 14px;
  background: linear-gradient(180deg, #444 0%, #222 100%);
  border-radius: 3px 3px 0 0;
  border: 1px solid #555;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
  position: relative;
}
.tpa-carriage::before,
.tpa-carriage::after {
  content: '';
  position: absolute;
  top: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #666;
  border: 1px solid #444;
}
.tpa-carriage::before { left: 3px; }
.tpa-carriage::after  { right: 3px; }

.tpa-hotend {
  width: 12px;
  height: 18px;
  background: linear-gradient(180deg, #333 0%, #1a1a1a 60%, #111 100%);
  clip-path: polygon(15% 0, 85% 0, 100% 40%, 80% 100%, 20% 100%, 0% 40%);
}

.tpa-nozzle {
  width: 4px;
  height: 5px;
  background: #111;
  border-radius: 0 0 3px 3px;
}

/* ── DRIP ────────────────────────────────────────────────── */
.tpa-drip {
  width: 2.5px;
  border-radius: 0 0 2px 2px;
  background: linear-gradient(180deg, #e46a2e 0%, rgba(228,106,46,0) 100%);
  height: 0;
  opacity: 0;
}
.tpa-drip.active {
  animation: tpa-drip-fall 0.27s ease-out forwards;
}
@keyframes tpa-drip-fall {
  0%   { height: 0;    opacity: 1; }
  60%  { height: 10px; opacity: 1; }
  100% { height: 10px; opacity: 0; }
}

/* ── GLOW ────────────────────────────────────────────────── */
.tpa-glow {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle, #e46a2e 30%, rgba(228,106,46,0) 100%);
  margin-top: -4px;
  opacity: 0;
  transition: opacity 0.12s;
}
.tpa-glow.on {
  opacity: 1;
  animation: tpa-glow-pulse 0.36s ease-in-out infinite alternate;
}
@keyframes tpa-glow-pulse {
  0%   { transform: scale(1);    opacity: 0.8; }
  100% { transform: scale(1.4);  opacity: 1;   }
}

/* ── LAMP LIGHT ──────────────────────────────────────────── */
/* Sits inside the shade; lights up once the print finishes. */
.tpa-lamp-light {
  position: absolute;
  left: 50%;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,214,120,.95) 0%, rgba(255,176,64,.55) 40%, rgba(255,150,40,0) 74%);
  filter: blur(1.5px);
  transform: translate(-50%, 50%) scale(0.3);
  opacity: 0;
  pointer-events: none;
  z-index: 15;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.tpa-lamp-light.on {
  opacity: 1;
  transform: translate(-50%, 50%) scale(1);
  animation: tpa-lamp-pulse 1.6s ease-in-out infinite alternate;
}
@keyframes tpa-lamp-pulse {
  0%   { opacity: 0.85; }
  100% { opacity: 1; }
}

/* ── OBJECT LAYER STACK ──────────────────────────────────── */
.tpa-object-wrap {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  width: 180px;
  overflow: hidden;
  max-height: 200px;
  z-index: 10;
}

.tpa-layer {
  display: block;
  height: 3px;
  border-radius: 0.4px;
  flex-shrink: 0;
  opacity: 0;
  transform-origin: center bottom;
  transform: scaleX(0.05);
}
.tpa-layer.in {
  animation: tpa-layer-appear 0.16s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes tpa-layer-appear {
  0%   { opacity: 0; transform: scaleX(0.05); }
  55%  { opacity: 1; transform: scaleX(1.04); }
  100% { opacity: 1; transform: scaleX(1);    }
}

/* ── PRINT BED ───────────────────────────────────────────── */
.tpa-bed {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  border-radius: 2px;
  border-top: 2px solid #b0aca4;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 18px,
      rgba(0,0,0,.05) 18px,
      rgba(0,0,0,.05) 19px
    ),
    linear-gradient(180deg, #d4d0c8 0%, #c0bcb4 100%);
  z-index: 5;
}

/* ══════════════════════════════════════════════════════════
   INFO PANEL , BELOW the cabinet, never inside it
   Centered under the cabinet via .tpa-wrap flexbox.
   ══════════════════════════════════════════════════════════ */
.tpa-info {
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap;
  user-select: none;
}

.tpa-info-layers,
.tpa-info-material {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.tpa-info-value {
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #3a3632;
  line-height: 1;
  letter-spacing: 0.01em;
  min-width: 20px;
  text-align: right;
}

.tpa-info-key {
  font-family: 'Manrope', sans-serif;
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #9a9a9a;
}

.tpa-info-sep {
  display: block;
  width: 1px;
  height: 18px;
  background: rgba(0,0,0,0.12);
}

/* ── RESET FADE ──────────────────────────────────────────── */
.tpa-object-wrap.resetting {
  animation: tpa-fade-out 0.5s ease-out forwards;
}
@keyframes tpa-fade-out {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 1100px) {
  .tpa-cabinet { width: 230px; }
  .tpa-scene   { height: 250px; }
}
@media (max-width: 600px) {
  #triakar-print-animation { display: none; }
}

</style>
</head>
<body>
  <div class="preview-shell">
    <div id="triakar-print-animation"></div>
  </div>
<script>
/**
 * hero-print-animation.js , TriAkar hero section
 * ─────────────────────────────────────────────────
 * DOM structure (injected):
 *
 *   .tpa-scene
 *     .tpa-label          ← "LIVE PRINT" badge  (static, top-left)
 *     .tpa-gantry         ← THE MOVING ASSEMBLY  (only top changes)
 *       .tpa-rail-track   ← horizontal rail      (full-width, static inside gantry)
 *       .tpa-head         ← carriage+hotend+nozzle (left changes inside gantry)
 *         .tpa-carriage
 *         .tpa-hotend
 *         .tpa-nozzle
 *         .tpa-drip
 *         .tpa-glow
 *     .tpa-object-wrap    ← layer stack          (bottom-anchored, centered)
 *     .tpa-bed            ← print bed            (static, bottom)
 *     .tpa-info           ← LAYERS / PLA+        (static, above bed)
 *
 * KEY INSIGHT:
 *   - .tpa-gantry is position:absolute, full scene width, height = head height.
 *   - Its `top` is driven by JS to track the current layer height.
 *   - .tpa-rail-track spans the full gantry width → always attached to gantry.
 *   - .tpa-head's `left` slides within the gantry for L/R passes.
 *   - Result: rail + head are ONE unit. No drift possible.
 *
 * Timing: ~19 s loop at 1.4x speed (28 layers × ~857 ms/layer + 0.9 s hold + 0.4 s reset).
 */

(function () {
  'use strict';

  /* ── Configuration ─────────────────────────────────────── */
  const CFG = {
    PASS_DURATION_MS: 750,    /* smooth, continuous nozzle sweep (1.4x speed) */
    LAYER_INTERVAL_MS: 107,   /* brief reversal pause, keeps motion flowing */
    HOLD_MS:          857,
    RESET_MS:          393,
    LAYER_HEIGHT_PX:     3,   /* must match .tpa-layer { height } in CSS */

    /* Table-lamp silhouette: wide base, thin neck, flared shade on top */
    objectWidth(i, total) {
      const t = i / total;
      if (t < 0.07) return 132 - t / 0.07 * 10;
      if (t < 0.16) return 122 - (t - 0.07) / 0.09 * 88;
      if (t < 0.60) return 34 + Math.sin((t - 0.16) / 0.44 * Math.PI) * 4;
      if (t < 0.68) return 34 + (t - 0.60) / 0.08 * 62;
      return 96 - (t - 0.68) / 0.32 * 38;
    },

    COLORS: [
      '#c8c4bc','#c4c0b8','#c0bcb2','#bcb8ac','#b8b2a4',
      '#c0ae9c','#c4a890','#caa086','#cc987c','#ca9070',
      '#c68866','#c2805c','#be7852','#ba7048','#b46840',
      '#ae6038','#a85830','#a05028','#984820','#904018',
      '#883812','#80320c','#782c08','#702604','#682002',
      '#601a00','#581400','#500e00',
    ],
  };

  /* ── Mount guard ────────────────────────────────────────── */
  const root = document.getElementById('triakar-print-animation');
  if (!root) return;
  if (root.dataset.tpaInit) return;
  root.dataset.tpaInit = '1';

  /* ── Inject DOM ─────────────────────────────────────────── */
  root.innerHTML = `
    <div class="tpa-wrap" id="tpaWrap">

      <!-- PRINTER CABINET, decorative frame around the scene -->
      <div class="tpa-cabinet">

        <!-- Static badge sits on top-left of cabinet -->
        <div class="tpa-label">
          <span class="tpa-label-dot"></span>
          LIVE PRINT
        </div>

        <!-- THE SCENE, sits inside the cabinet -->
        <div class="tpa-scene" id="tpaScene">

          <!-- THE GANTRY: rail + head move together as one unit -->
          <div class="tpa-gantry" id="tpaGantry">
            <div class="tpa-rail-track"></div>
            <div class="tpa-head" id="tpaHead">
              <div class="tpa-carriage"></div>
              <div class="tpa-hotend"></div>
              <div class="tpa-nozzle"></div>
              <div class="tpa-drip" id="tapDrip"></div>
              <div class="tpa-glow" id="tpaGlow"></div>
            </div>
          </div>

          <!-- Layer stack, grows upward from bed -->
          <div class="tpa-object-wrap" id="tpaObject"></div>

          <!-- Light inside the shade, sibling of the stack so a reset
               (which wipes .tpa-object-wrap) never removes it -->
          <div class="tpa-lamp-light" id="tpaLampLight"></div>

          <!-- Static bed -->
          <div class="tpa-bed"></div>

        </div><!-- /.tpa-scene -->

      </div><!-- /.tpa-cabinet -->

      <!-- Info panel, BELOW the cabinet, never inside -->
      <div class="tpa-info">
        <span class="tpa-info-layers">
          <span class="tpa-info-value" id="tpaLayerCount">0</span>
          <span class="tpa-info-key">LAYERS</span>
        </span>
        <span class="tpa-info-sep"></span>
        <span class="tpa-info-material">
          <span class="tpa-info-value">PLA+</span>
          <span class="tpa-info-key">MATERIAL</span>
        </span>
      </div>

    </div>`;

  /* ── Refs ───────────────────────────────────────────────── */
  const scene        = document.getElementById('tpaScene');
  const gantry       = document.getElementById('tpaGantry');
  const head         = document.getElementById('tpaHead');
  const objWrap      = document.getElementById('tpaObject');
  const drip         = document.getElementById('tapDrip');
  const glow         = document.getElementById('tpaGlow');
  const lampLight    = document.getElementById('tpaLampLight');
  const layerCountEl = document.getElementById('tpaLayerCount');

  /* ── State ──────────────────────────────────────────────── */
  let layerIndex    = 0;
  const totalLayers = CFG.COLORS.length;
  let isRunning     = false;

  /* ── Layout math ────────────────────────────────────────── */
  /*
   * Scene height: 340px.  Bed height: 28px.
   * Bed surface (from scene top): 340 - 28 = 312px.
   *
   * Gantry height = carriage(14) + hotend(18) + nozzle(5) = 37px.
   * The gantry's BOTTOM edge = nozzle tip.
   *
   * We want nozzle tip to be flush with the TOP of the layer
   * about to be printed (= top of the stack so far).
   *
   *   stackTop = BED_SURFACE_Y - layerIndex * LAYER_HEIGHT_PX
   *   gantry.top = stackTop - GANTRY_HEIGHT
   *
   * (All values from scene top.)
   */
  /* Scene height changes at the 1100px / 600px CSS breakpoints
   * (280 / 250), so it's read live instead of hardcoded, otherwise
   * the gantry math drifts and the nozzle floats off the object on
   * every tablet/mobile viewport.
   * Bed surface = scene height - bed height.           */
  const BED_HEIGHT     = 28;
  const GANTRY_HEIGHT  = 37;                           // carriage+hotend+nozzle

  function sceneH() { return scene.offsetHeight || 280; }

  function gantryTopForLayer(idx) {
    const bedSurfaceY = sceneH() - BED_HEIGHT;
    const stackTop = bedSurfaceY - idx * CFG.LAYER_HEIGHT_PX;
    return stackTop - GANTRY_HEIGHT;
  }

  function sceneW() { return scene.offsetWidth || 260; }
  function xPx(pct) { return Math.round(sceneW() * pct / 100); }

  /* Lamp light sits inside the shade, near the top of the finished print */
  lampLight.style.bottom = (BED_HEIGHT + totalLayers * CFG.LAYER_HEIGHT_PX * 0.8) + 'px';

  /* ── Move helpers ───────────────────────────────────────── */
  /* Slide head L/R within the gantry (only left changes) */
  function slideHead(xPercent, durationMs) {
    head.style.transition = durationMs
      ? `left ${durationMs}ms cubic-bezier(0.45,0,0.55,1)`
      : 'none';
    head.style.left = xPx(xPercent) + 'px';
  }

  /* Lift entire gantry to the correct Y for a given layer */
  function liftGantry(layerIdx, animate) {
    gantry.style.transition = animate ? 'top 0.11s ease-out' : 'none';
    gantry.style.top = gantryTopForLayer(layerIdx) + 'px';
  }

  /* ── Deposit effect ─────────────────────────────────────── */
  function depositEffect() {
    glow.classList.add('on');
    drip.classList.remove('active');
    void drip.offsetWidth;
    drip.classList.add('active');
    setTimeout(() => {
      glow.classList.remove('on');
      drip.classList.remove('active');
    }, 271);
  }

  /* ── Deposit one layer ──────────────────────────────────── */
  function depositLayer() {
    if (layerIndex >= totalLayers) return;

    const el = document.createElement('span');
    el.className        = 'tpa-layer';
    el.style.width      = CFG.objectWidth(layerIndex, totalLayers) + 'px';
    el.style.background = CFG.COLORS[layerIndex];
    el.style.boxShadow  = 'inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.1)';
    objWrap.appendChild(el);

    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));

    depositEffect();
    layerIndex++;
    layerCountEl.textContent = layerIndex;
  }

  /* ── Single pass ──────────────────────────────────────────
     One uninterrupted sweep across the bed. The head is never
     snapped mid-pass: each pass starts exactly where the last
     one ended (alternating sides), so motion stays continuous.
     The layer is deposited at the midpoint, where the easing
     naturally places the head over the centre, no jump.       */
  function runPass() {
    if (!isRunning) return;

    const goRight = (layerIndex % 2 === 0);
    const endPct  = goRight ? 92 : 8;   /* sweeps to the opposite edge */

    requestAnimationFrame(() => requestAnimationFrame(() => {
      /* one smooth sweep all the way across */
      slideHead(endPct, CFG.PASS_DURATION_MS);

      /* deposit at the midpoint, head is centred there, no snap */
      setTimeout(() => {
        if (isRunning) depositLayer();   /* layerIndex++ happens here */
      }, CFG.PASS_DURATION_MS * 0.5);

      /* at the end of the sweep: lift to the new layer height and chain.
         The lift overlaps the start of the next sweep, so the head
         glides sideways while the gantry rises, fluid, no stutter. */
      setTimeout(() => {
        if (!isRunning) return;
        liftGantry(layerIndex, true);

        if (layerIndex < totalLayers) {
          setTimeout(runPass, CFG.LAYER_INTERVAL_MS);
        } else {
          glow.classList.remove('on');
          lampLight.classList.add('on');   /* print done: the lamp lights up */
          setTimeout(reset, CFG.HOLD_MS);
        }
      }, CFG.PASS_DURATION_MS);
    }));
  }

  /* ── Reset ──────────────────────────────────────────────── */
  let isResetting = false;
  function reset() {
    if (isResetting) return;
    isResetting = true;
    isRunning = false;
    glow.classList.remove('on');
    lampLight.classList.remove('on');
    objWrap.classList.add('resetting');

    setTimeout(() => {
      objWrap.innerHTML = '';
      objWrap.classList.remove('resetting');
      layerIndex = 0;
      layerCountEl.textContent = '0';
      setTimeout(() => {
        isResetting = false;
        start();
      }, 214);
    }, CFG.RESET_MS);
  }

  /* ── Start ──────────────────────────────────────────────── */
  function start() {
    if (isRunning) return;
    isRunning = true;
    liftGantry(0, false);
    slideHead(8, 0);
    setTimeout(runPass, 250);
  }

  /* ── Tab visibility ─────────────────────────────────────── */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      isRunning = false;
    } else if (!isResetting) {
      layerIndex > 0 && layerIndex < totalLayers ? reset() : start();
    }
  });

  /* ── Boot ───────────────────────────────────────────────── */
  document.readyState === 'complete' ? start() : window.addEventListener('load', start);

})();
