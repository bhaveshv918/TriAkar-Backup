<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offline — TriAkar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161614">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--ink:#161614;--ivory:#f4f2ec;--accent:#c4622a;--stone:#6b6862}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--ink);color:var(--ivory);min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;line-height:1.5}
  .wrap{max-width:380px}
  .mark{margin:0 auto 28px;width:64px;height:64px;display:block}
  h1{font-size:22px;font-weight:700;letter-spacing:.01em;margin-bottom:12px}
  p{font-size:14px;color:#bdbab2;margin-bottom:26px}
  .btn{display:inline-block;background:var(--ivory);color:var(--ink);text-decoration:none;font-size:12px;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:13px 30px;border-radius:8px;
    border:none;cursor:pointer;transition:transform .15s,opacity .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{opacity:.85}
  .hint{margin-top:20px;font-size:12px;color:var(--stone)}
  .logo-en{font-family:Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.18em;margin-top:34px;display:block;color:#fff}
  .logo-en span{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#161614" stroke="#2a2a26" stroke-width="1"/>
      <polygon points="16,6 27,25 5,25" fill="none" stroke="#C4622A" stroke-width="1.6"/>
      <text x="16" y="21.5" text-anchor="middle" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#F4F2EC" letter-spacing="1">T</text>
    </svg>
    <h1>You're offline</h1>
    <p>It looks like you've lost your connection. Check your network and try again — your cart and saved items are safe on this device.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
    <div class="hint">Some pages you've already visited may still work offline.</div>
    <span class="logo-en"><span>TRI</span>AKAR</span>
  </div>
  <script>
    // Auto-reload the moment the connection returns.
    window.addEventListener('online', function(){ location.reload(); });
  </script>
</body>
</html>
