<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Meeting Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 0;
    }

    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #080808;
      border-bottom: 1px solid #1a1a1a;
      z-index: 10;
    }
    .top-bar h1 { font-size: 0.8rem; font-weight: 500; color: #555; letter-spacing: 0.12em; text-transform: uppercase; }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row input {
      background: #111;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 7px 12px;
      color: #aaa;
      font-size: 0.78rem;
      width: 260px;
      outline: none;
      font-family: monospace;
      transition: border-color 0.2s;
    }
    .key-row input:focus { border-color: #444; color: #f0f0f0; }
    .key-row input::placeholder { color: #333; }
    .key-saved { font-size: 0.72rem; color: #2d6a2d; background: #0e1e0e; border: 1px solid #1a3a1a; border-radius: 5px; padding: 5px 10px; cursor: pointer; transition: background 0.2s; }
    .key-saved:hover { background: #112211; }
    .key-btn { font-size: 0.72rem; color: #888; background: #151515; border: 1px solid #252525; border-radius: 5px; padding: 6px 12px; cursor: pointer; transition: all 0.15s; }
    .key-btn:hover { background: #1e1e1e; color: #f0f0f0; border-color: #333; }

    .main { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 640px; margin-top: 60px; gap: 24px; }

    .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .mic-btn {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: #111;
      border: 1.5px solid #2a2a2a;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
      position: relative;
      outline: none;
    }
    .mic-btn:hover { border-color: #444; background: #161616; }
    .mic-btn:active { transform: scale(0.96); }
    .mic-btn.listening {
      border-color: #dc2626;
      background: #180a0a;
      animation: mic-pulse 1.8s ease-in-out infinite;
    }
    .mic-btn svg { width: 32px; height: 32px; }
    .mic-btn.listening svg { stroke: #ef4444; }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.35); }
      50%       { box-shadow: 0 0 0 14px rgba(220,38,38,0); }
    }

    .status {
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 0.05em;
      text-align: center;
      min-height: 18px;
      transition: color 0.2s;
    }
    .status.listening { color: #ef4444; }
    .status.thinking  { color: #d97706; }
    .status.done      { color: #4ade80; }

    .card {
      width: 100%;
      background: #0e0e0e;
      border: 1px solid #1c1c1c;
      border-radius: 14px;
      padding: 18px 22px;
      min-height: 60px;
    }
    .card-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #333;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .card-text {
      font-size: 0.92rem;
      color: #555;
      line-height: 1.6;
    }
    .card-text.has-content { color: #bbb; }

    .answer-card {
      width: 100%;
      background: #090f09;
      border: 1px solid #162016;
      border-radius: 14px;
      padding: 22px 26px;
      min-height: 90px;
      position: relative;
    }
    .answer-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #1e3e1e;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .answer-text {
      font-size: 1.15rem;
      line-height: 1.75;
      color: #3a3a3a;
      font-weight: 300;
    }
    .answer-text.has-content { color: #d4f0d4; }

    .copy-btn {
      position: absolute;
      top: 14px; right: 16px;
      background: transparent;
      border: 1px solid #1a3a1a;
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 0.68rem;
      color: #2d5a2d;
      cursor: pointer;
      transition: all 0.15s;
      opacity: 0;
    }
    .answer-card:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: #0e2a0e; color: #6aee6a; }
    .copy-btn.copied { color: #4ade80; border-color: #2d6a2d; }

    .hint {
      font-size: 0.72rem;
      color: #2a2a2a;
      text-align: center;
    }

    .error-msg {
      font-size: 0.78rem;
      color: #dc2626;
      text-align: center;
      background: #1a0808;
      border: 1px solid #3a1010;
      border-radius: 8px;
      padding: 10px 16px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .shortcut-hint {
      font-size: 0.68rem;
      color: #252525;
      margin-top: -10px;
    }
    kbd {
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.65rem;
      color: #444;
      font-family: monospace;
    }
  </style>
</head>
<body>

<!-- Top bar: title + API key -->
<div class="top-bar">
  <h1>Meeting Assistant</h1>
  <div class="key-row">
    <input type="password" id="apiKey" placeholder="sk-ant-... (Anthropic API key)" autocomplete="off" spellcheck="false">
    <button class="key-btn" onclick="saveKey()" id="saveBtn">Save</button>
  </div>
</div>

<!-- Main content -->
<div class="main">

  <!-- Mic button -->
  <div class="mic-wrap">
    <button class="mic-btn" id="micBtn" onclick="toggleListen()" title="Click or press Space">
      <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="13" rx="3"/>
        <path d="M5 10a7 7 0 0014 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
    </button>
    <div class="status" id="status">Click mic to start</div>
    <div class="shortcut-hint">or press <kbd>Space</kbd></div>
  </div>

  <!-- What was heard -->
  <div class="card">
    <div class="card-label">Question heard</div>
    <div class="card-text" id="transcript">—</div>
  </div>

  <!-- Answer -->
  <div class="answer-card">
    <div class="answer-label">Answer</div>
    <div class="answer-text" id="answer">—</div>
    <button class="copy-btn" id="copyBtn" onclick="copyAnswer()">Copy</button>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <div class="hint">Tap mic · ask question · get a short, clear answer</div>

</div>

<script>
  // ─── API Key ───────────────────────────────────────────────────────────────
  const keyInput  = document.getElementById('apiKey');
  const saveBtn   = document.getElementById('saveBtn');
  const savedKey  = localStorage.getItem('ant_meeting_key');

  if (savedKey) {
    keyInput.value = savedKey;
    saveBtn.textContent = '✓ Saved';
    saveBtn.className = 'key-saved';
  }

  function saveKey() {
    const k = keyInput.value.trim();
    if (!k.startsWith('sk-ant-')) {
      showError('Key should start with sk-ant-…');
      return;
    }
    localStorage.setItem('ant_meeting_key', k);
    saveBtn.textContent = '✓ Saved';
    saveBtn.className = 'key-saved';
    clearError();
    setStatus('Key saved — click mic to start', '');
  }

  function getKey() {
    return localStorage.getItem('ant_meeting_key') || keyInput.value.trim();
  }

  // ─── Status / Error helpers ────────────────────────────────────────────────
  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (cls || '');
  }
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }
  function clearError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  // ─── Copy answer ───────────────────────────────────────────────────────────
  function copyAnswer() {
    const text = document.getElementById('answer').textContent;
    if (!text || text === '—') return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
    });
  }

  // ─── Speech Recognition ───────────────────────────────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let finalText = '';

  if (!SR) {
    setStatus('Speech API not supported — use Chrome or Edge', '');
    document.getElementById('micBtn').disabled = true;
  } else {
    recognition = new SR();
    recognition.continuous    = false;
    recognition.interimResults = true;
    recognition.lang          = 'en-IN';
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      finalText = '';
      document.getElementById('micBtn').classList.add('listening');
      document.getElementById('transcript').textContent = '...';
      document.getElementById('transcript').classList.remove('has-content');
      setStatus('Listening…', 'listening');
      clearError();
    };

    recognition.onresult = (e) => {
      let interim = '';
      finalText = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const display = finalText || interim;
      const el = document.getElementById('transcript');
      el.textContent = display || '...';
      el.classList.toggle('has-content', !!display);
    };

    recognition.onend = () => {
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
      if (finalText.trim()) {
        askClaude(finalText.trim());
      } else {
        setStatus('Nothing heard — try again', '');
      }
    };

    recognition.onerror = (e) => {
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
      if (e.error === 'not-allowed') showError('Microphone access denied. Allow mic in browser settings and reload.');
      else if (e.error === 'network') showError('Network error during speech recognition.');
      else setStatus('Error: ' + e.error, '');
    };
  }

  function toggleListen() {
    if (!recognition) return;
    if (!getKey()) { showError('Paste your Anthropic API key above and click Save first.'); return; }
    if (listening) { recognition.stop(); }
    else { recognition.start(); }
  }

  // Space bar shortcut
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      toggleListen();
    }
  });

  // ─── Claude API (streaming) ───────────────────────────────────────────────
  async function askClaude(question) {
    const key = getKey();
    if (!key) return;

    setStatus('Getting answer…', 'thinking');
    const answerEl = document.getElementById('answer');
    answerEl.textContent = '';
    answerEl.classList.remove('has-content');
    clearError();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 180,
          stream: true,
          system: 'You are a sharp, friendly meeting assistant. Someone asked a question mid-meeting. Reply in 2–4 clear, simple English sentences. Be direct and accurate. No bullet points, no headings, just plain natural language. Keep it concise.',
          messages: [{ role: 'user', content: question }]
        })
      });

      if (!res.ok) {
        let msg = `API error ${res.status}`;
        try { const j = await res.json(); msg = j.error?.message || msg; } catch {}
        showError(msg);
        setStatus('Error — check your API key', '');
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
              answerEl.textContent += parsed.delta.text;
              answerEl.classList.add('has-content');
            }
          } catch {}
        }
      }

      setStatus('Done — click mic or press Space for next question', 'done');
    } catch (err) {
      showError('Network error: ' + err.message);
      setStatus('Failed', '');
    }
  }
</script>

</body>
</html>
