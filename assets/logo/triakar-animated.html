  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #F4F2EC;
  }

  .logo-wrap {
    position: relative;
    width: 340px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid #C4622A;
    opacity: 0;
    animation: pulse 2.8s ease-out infinite;
  }
  .ring:nth-child(2) { animation-delay: 0.9s; }
  .ring:nth-child(3) { animation-delay: 1.8s; }

  @keyframes pulse {
    0%   { transform: scale(0.72); opacity: 0.55; }
    100% { transform: scale(1.28); opacity: 0; }
  }

  .logo-card {
    position: relative;
    z-index: 1;
    width: 260px;
    height: 260px;
    background: #F4F2EC;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow:
      0 8px 24px rgba(22, 22, 20, 0.10),
      0 2px 6px  rgba(22, 22, 20, 0.06);
    animation: float 3.6s ease-in-out infinite;
  }

  @keyframes float {
    0%,  100% { transform: translateY(0px); }
