<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <filter id="circleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Orange top half -->
  <rect x="0" y="0" width="640" height="320" fill="#C4622A"/>

  <!-- Dark bottom half -->
  <rect x="0" y="320" width="640" height="320" fill="#161614"/>

  <!-- White circle -->
  <circle cx="320" cy="316" r="238" fill="#F4F2EC" filter="url(#circleShadow)"/>

  <!-- त्रि character -->
  <text
    x="320"
    y="316"
    font-family="'Noto Sans Devanagari', Mangal, 'Arial Unicode MS', sans-serif"
    font-size="264"
    font-weight="700"
    fill="#C4622A"
    text-anchor="middle"
    dominant-baseline="central"
  >त्रि</text>
</svg>
