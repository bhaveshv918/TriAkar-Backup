<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <clipPath id="markClipL">
      <rect x="80" y="80" width="240" height="240" rx="22"/>
    </clipPath>
    <filter id="circleShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#F4F2EC"/>

  <!-- ── Mark icon ── -->
  <!-- Orange top half of mark -->
  <rect x="80" y="80" width="240" height="120" fill="#C4622A" clip-path="url(#markClipL)"/>
  <!-- Dark bottom half -->
  <rect x="80" y="200" width="240" height="120" fill="#161614" clip-path="url(#markClipL)"/>
  <!-- Subtle border -->
  <rect x="80" y="80" width="240" height="240" rx="22" fill="none" stroke="rgba(22,22,20,0.10)" stroke-width="1"/>

  <!-- White circle inside mark -->
  <circle cx="200" cy="200" r="92" fill="#F4F2EC" filter="url(#circleShadowL)"/>

  <!-- त्रि inside mark -->
  <text
    x="200"
    y="200"
    font-family="'Noto Sans Devanagari', Mangal, 'Arial Unicode MS', sans-serif"
    font-size="106"
    font-weight="700"
    fill="#C4622A"
    text-anchor="middle"
    dominant-baseline="central"
  >त्रि</text>

  <!-- ── Vertical divider ── -->
  <line x1="368" y1="116" x2="368" y2="284" stroke="rgba(22,22,20,0.10)" stroke-width="1"/>

  <!-- ── Wordmark ── -->
  <!-- TriAkar -->
  <text
    x="408"
    y="188"
    font-family="'Manrope', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="78"
    font-weight="700"
    fill="#161614"
    dominant-baseline="middle"
  >TriAkar</text>

  <!-- त्रिआकार -->
  <text
    x="412"
    y="264"
    font-family="'Noto Sans Devanagari', Mangal, sans-serif"
    font-size="27"
    font-weight="400"
    fill="rgba(22,22,20,0.42)"
    dominant-baseline="middle"
  >त्रिआकार</text>
</svg>
