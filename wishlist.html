<script>
/* Build a product lookup (price, image, category) from the live API,
   falling back to the local PRODUCTS map so cards render even offline. */
const WL_API = window.location.hostname==='localhost' ? 'http://localhost:3000' : 'https://triakar.onrender.com';

function _wlPlaceholder(){
  return '<svg viewBox="0 0 80 80" fill="none" style="width:48px;opacity:.5"><rect x="10" y="10" width="60" height="60" rx="4" fill="#E8E4DC"/></svg>';
}

async function _wlProductMap(){
  const map={};
  // Local fallback first
  try{
    if(typeof PRODUCTS!=='undefined'){
      Object.keys(PRODUCTS).forEach(function(slug){
        const p=PRODUCTS[slug];
        map[slug]={name:p.name,price:p.price,category:p.category,image:(typeof getProductImage==='function'?getProductImage(p):null)};
      });
    }
  }catch(_){}
  // Live data overrides
  try{
    const res=await fetch(WL_API+'/api/products');
    if(res.ok){
      const json=await res.json();
      const prods=json.products||json||[];
      prods.forEach(function(p){
        map[p.slug]={name:p.name,price:p.price,category:p.category,image:(p.images&&p.images.length?p.images[0]:(map[p.slug]&&map[p.slug].image))};
      });
    }
  }catch(_){}
  return map;
}

function _wlRender(items, pmap){
  const root=document.getElementById('wlContent');
  if(!root)return;
  if(!items.length){
    root.innerHTML=
      '<div class="wl-empty">'
      +'<div class="wl-empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>'
      +'<h2>Your wishlist is empty</h2>'
      +'<p>Tap the heart on any product to save it here. Your saved items stay with you and sync when you sign in.</p>'
      +'<a href="products.html" class="btn btn-dark">Browse products →</a>'
      +'</div>';
    return;
  }
  let html='<div style="font-size:13px;color:var(--stone);margin-bottom:18px;font-weight:500">'+items.length+' saved item'+(items.length>1?'s':'')+'</div><div class="wl-grid">';
  items.forEach(function(it){
    const p=pmap[it.slug]||{};
    const name=p.name||it.name||it.slug;
    const price=(p.price!=null)?('₹'+Number(p.price).toLocaleString('en-IN')):'';
    const cat=p.category||'';
    const detail='product-detail.html?slug='+encodeURIComponent(it.slug);
    const img=p.image?('<img src="'+_esc(taImg(p.image,{w:300}))+'" alt="'+_esc(name)+'" width="240" height="240" loading="lazy" decoding="async">'):_wlPlaceholder();
    html+=
      '<div class="wl-card" data-slug="'+_esc(it.slug)+'">'
      +'<button class="wl-heart active wl-card-rm" data-slug="'+_esc(it.slug)+'" data-name="'+_esc(name)+'" aria-pressed="true" aria-label="Remove from wishlist" onclick="_wlRemove(this)"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>'
      +'<a href="'+detail+'" class="wl-card-img" aria-label="'+_esc(name)+'">'+img+'</a>'
      +'<div class="wl-card-body">'
      +(cat?'<div class="wl-card-cat">'+_esc(cat)+'</div>':'')
      +'<div class="wl-card-name"><a href="'+detail+'">'+_esc(name)+'</a></div>'
      +(price?'<div class="wl-card-price">'+price+'</div>':'')
      +'<div class="wl-card-actions">'
      +'<button class="btn btn-dark" data-label="Add to Cart" onclick="_wlAddToCart(this,\''+_esc(it.slug)+'\')">Add to Cart</button>'
      +'</div>'
      +'</div>'
      +'</div>';
  });
  html+='</div>';
  root.innerHTML=html;
}

let _WL_PMAP={};
async function _wlInit(){
  _WL_PMAP=await _wlProductMap();
  // Pull latest from server if logged in, then render local state
  if(typeof Wishlist!=='undefined'){
    await Wishlist.loadFromServer();
    _wlRender(Wishlist.getItems(), _WL_PMAP);
  }else{
    _wlRender([], _WL_PMAP);
  }
}

function _wlRemove(btn){
  const slug=btn.getAttribute('data-slug');
  if(typeof Wishlist!=='undefined')Wishlist.remove(slug);
  _wlRender(Wishlist.getItems(), _WL_PMAP);
}

function _wlAddToCart(btn,slug){
  const p=_WL_PMAP[slug]||{};
  if(p.price==null){window.location.href='product-detail.html?slug='+encodeURIComponent(slug);return;}
  addToCartBtn(btn,{id:slug,name:p.name||slug,price:p.price,image:p.image||'',color:''});
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_wlInit);
else _wlInit();
</script>
